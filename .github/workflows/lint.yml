# 在 ubuntu / macos / windows 三个平台并行运行，每个平台内串行完成：
#   1. 安装所有语言依赖（pnpm / Rust toolchain / Java）
#   2. 通过 moon 执行各语言 lint / test / build
name: Lint

on:
  push:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Lint (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 系统依赖：仅 Linux 需要 Tauri GTK 库 ──
      - name: Install Tauri system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── JS/TS 依赖 ──
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install

      # ── Rust 依赖 ──
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Fetch Cargo dependencies
        run: cargo fetch

      # ── Java 依赖 ──
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download Gradle dependencies
        run: ./gradlew dependencies --no-daemon

      # ── JS / Rust / Java lint（moon）──
      - name: Lint
        run: pnpm pre-commit

      # ── Rust + Java test ──
      - name: Test
        run: pnpm test

      # ── Java build ──
      - name: Java build
        run: pnpm exec moon run vega:build
