# 每次推送到任意分支时，按 lint → test → build → release 的顺序运行。
# 每个提交都会产生一个以 SHA 命名的预发布 Release，便于下载对应的构建产物。
name: CI and release

on:
  push:

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-and-release:
    name: Lint, test, build, and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Lint and test
        run: pnpm exec moon run :lint :lint-rustfmt :test

      - name: Build JavaScript packages
        run: pnpm build

      - name: Build Rust packages
        run: cargo build --workspace --release

      - name: Build Java packages
        run: pnpm exec moon run vega:build

      - name: Package build artifacts
        id: package
        shell: bash
        run: |
          archive_name="liry-k-${GITHUB_SHA}.tar.gz"
          mkdir -p release-artifacts
          # 跳过 node_modules：pnpm 目录树里也有大量 dist，复制会因超长路径或环状符号链接失败
          find apps packages infra demos \
            \( -name node_modules -o -name .git \) -prune -o \
            -type d -name dist \
            -exec cp -a --parents {} release-artifacts \;
          find mc-plugins \
            \( -name node_modules -o -name .git \) -prune -o \
            -type f -name '*.jar' -path '*/build/libs/*' \
            -exec cp --parents {} release-artifacts \;
          if [ -d target/release ]; then
            find target/release -maxdepth 1 -type f -executable \
              -exec cp --parents {} release-artifacts \;
          fi
          tar -C release-artifacts -czf "$archive_name" .
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: CI build ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive_name }}
