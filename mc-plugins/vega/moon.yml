language: java
layer: application

# Windows 默认 pwsh 会把 `:vega:classes` 解析成 label。任务选择器去掉前导冒号，
# 并从本项目强制走 Git Bash，避免只靠 workspace 继承时 bash 不在 PATH 上又回退到 pwsh。
taskOptions:
  shell: true
  windowsShell: bash

tasks:
  build:
    command: ./gradlew
    args:
      - 'vega:build'
      - --no-daemon
    inputs:
      - 'src/**/*'
      - 'build.gradle.kts'
    options:
      runFromWorkspaceRoot: true
      cache: false
      mergeArgs: replace
  lint:
    command: ./gradlew
    args:
      - 'vega:classes'
      - --no-daemon
    inputs:
      - 'src/**/*'
      - 'build.gradle.kts'
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace
  test:
    command: ./gradlew
    args:
      - 'vega:test'
      - --no-daemon
    inputs:
      - 'src/**/*'
      - 'build.gradle.kts'
    options:
      runFromWorkspaceRoot: true
      cache: false
      mergeArgs: replace
