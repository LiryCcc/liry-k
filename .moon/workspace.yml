# Configures all projects within the workspace to create a project graph.
# npm packages via globs; Rust crates and the nested Tauri crate via sources
# (`rust-packages/*` would also match files like `.gitignore`).
projects:
  globs:
    - 'apps/*'
    - 'packages/*'
    - 'infra/*'
    - 'demos/*'
    - 'mc-plugins/*'
  sources:
    polaris-tauri: 'apps/polaris/src-tauri'
    rust-leetcode: 'rust-packages/leetcode'
    sirius: 'rust-packages/sirius'

vcs:
  defaultBranch: 'main'
  provider: 'github'
