# Enable JavaScript via Node + pnpm, and Rust via Cargo. Versions are not
# pinned here so moon uses the machine / CI toolchain (node >= 24, pnpm >= 10,
# rustup, JDK 21 via Gradle). Java tasks use the system Gradle Wrapper.
javascript:
  packageManager: 'pnpm'
  inferTasksFromScripts: true
  # Keep existing workspace:* / catalog: ranges; do not rewrite package.json.
  syncPackageManagerField: false
  syncProjectWorkspaceDependencies: false
  dedupeOnLockfileChange: false
  # Repo already installs via pnpm; auto-install would re-enter postinstall -> build.
  installDependencies: false

node: {}
pnpm: {}

rust:
  installDependencies: false
